<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi Th? Gi?i Tích 2 - Ð?t 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .correct { border: 2px solid #22c55e; background-color: #f0fdf4; }
        .incorrect { border: 2px solid #ef4444; background-color: #fef2f2; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

    <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Gi?i Tích 2 - Ð?t 2</h1>
        <p class="text-gray-600 mb-8 text-center italic">Hoàn thành 10 câu h?i ð? ki?m tra ki?n th?c c?a b?n.</p>

        <div id="quiz-container" class="space-y-8">
            <!-- Questions will be injected here -->
        </div>

        <div class="mt-10 text-center">
            <button onclick="submitQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition duration-300">
                N?p bài ngay
            </button>
        </div>

        <div id="result-container" class="mt-8 hidden p-6 rounded-xl text-center">
            <h2 id="score-text" class="text-2xl font-bold mb-2"></h2>
            <p id="feedback-text" class="text-gray-700"></p>
        </div>
    </div>

    <script>
        const questions = [
            { id: 1, text: "Câu 11: Tính I = ?D x dxdy v?i D gi?i h?n b?i x=0, y=0, x+y=1:", options: ["1/6", "1/3", "1/2", "1"], answer: 0 },
            { id: 2, text: "Câu 12: Khi chuy?n sang t?a ð? c?c, tích phân ?D f(x,y) dxdy trên mi?n D: x² + y² ? 4 có c?n c?a r là:", options: ["0 ? r ? 4", "0 ? r ? 2", "0 ? r ? ?2", "-2 ? r ? 2"], answer: 1 },
            { id: 3, text: "Câu 13: Tính tích phân ðý?ng lo?i 1 I = ?L (x+y) ds v?i L t? O(0,0) ð?n A(1,1):", options: ["?2", "1", "?2/2", "0"], answer: 0 },
            { id: 4, text: "Câu 14: Cho m?t S: z = 1 - x - y (góc ph?n 8 th? nh?t). Công th?c dS là:", options: ["dx dy", "?2 dx dy", "?3 dx dy", "2 dx dy"], answer: 2 },
            { id: 5, text: "Câu 15: Nghi?m t?ng quát c?a phýõng tr?nh y'' + 4y = 0 là:", options: ["y = C1 cos 2x + C2 sin 2x", "y = C1 e^2x + C2 e^-2x", "y = C1 cos x + C2 sin x", "y = C1 + C2 e^2x"], answer: 0 },
            { id: 6, text: "Câu 16: Ði?m d?ng c?a hàm z = x³ - 3xy + y³ là:", options: ["(0,0) và (1,1)", "(0,0) và (-1, -1)", "(1,1)", "Không có ði?m d?ng"], answer: 0 },
            { id: 7, text: "Câu 17: Phýõng tr?nh y' - y = y² là phýõng tr?nh:", options: ["Tuy?n tính", "Bernoulli", "Ð?ng c?p", "Tách bi?n"], answer: 1 },
            { id: 8, text: "Câu 18: Tích phân ðý?ng lo?i 2 ?L (x²) dx + (y²) dy v?i L là cung tr?n t? (1,0) ð?n (0,1) theo chi?u kim ð?ng h?:", options: ["0", "2/3", "-2/3", "1"], answer: 2 },
            { id: 9, text: "Câu 19: Công th?c Green ?L P dx + Q dy b?ng:", options: ["?D (Q'x - P'y) dx dy", "?D (P'x - Q'y) dx dy", "?D (Q'y - P'x) dx dy", "?D (P'y + Q'x) dx dy"], answer: 0 },
            { id: 10, text: "Câu 20: Nghi?m riêng c?a y'' - y = sin x:", options: ["y = 1/2 sin x", "y = -1/2 sin x", "y = sin x", "y = -sin x"], answer: 1 }
        ];

        const container = document.getElementById('quiz-container');
        questions.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'q-item p-4 border rounded-lg bg-gray-50';
            qDiv.innerHTML = `
                <p class="font-semibold text-gray-800 mb-3">${q.text}</p>
                <div class="space-y-2">
                    ${q.options.map((opt, i) => `
                        <label class="block p-2 border rounded cursor-pointer hover:bg-gray-100">
                            <input type="radio" name="q${q.id}" value="${i}" class="mr-2"> ${opt}
                        </label>
                    `).join('')}
                </div>
            `;
            container.appendChild(qDiv);
        });

        function submitQuiz() {
            let score = 0;
            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                const qItem = document.getElementsByClassName('q-item')[index];
                
                if (selected) {
                    if (parseInt(selected.value) === q.answer) {
                        score++;
                        qItem.classList.add('correct');
                    } else {
                        qItem.classList.add('incorrect');
                    }
                } else {
                    qItem.classList.add('incorrect');
                }
            });

            const resultContainer = document.getElementById('result-container');
            const scoreText = document.getElementById('score-text');
            const feedbackText = document.getElementById('feedback-text');

            resultContainer.classList.remove('hidden');
            scoreText.innerText = `Ði?m s?: ${score} / 10`;
            scoreText.className = score >= 5 ? "text-2xl font-bold mb-2 text-green-600" : "text-2xl font-bold mb-2 text-red-600";
            feedbackText.innerText = score >= 5 ? "R?t t?t! B?n ð? n?m khá ch?c ki?n th?c." : "C?n ôn t?p thêm các d?ng bài này nhé.";
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
